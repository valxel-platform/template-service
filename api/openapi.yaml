openapi: 3.1.0
info:
  title: Template service API
  version: 1.0.0
  description: >
    Rename and extend when you create a repo from this template. Versioned under /api/v1;
    change it by expanding first, never by breaking. Errors are RFC 9457 problem details.
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /greetings:
    get:
      operationId: getGreeting
      summary: Greet someone by name
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: The greeting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Greeting" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /greetings/{id}:
    put:
      operationId: saveGreeting
      summary: Save a custom greeting
      description: >
        Publishes a greeting.saved event to Kafka and answers once Kafka holds it. The read models
        show the change once the event workers have applied it. 503 means nothing changed: retry
        with the same Idempotency-Key.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveGreeting" }
      responses:
        "202":
          description: Accepted; the event workers will apply it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        message: { type: string }
    SaveGreeting:
      type: object
      required: [name, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        message: { type: string, minLength: 1, maxLength: 200 }
    Accepted:
      type: object
      required: [eventId, status]
      properties:
        eventId: { type: string }
        status: { type: string, enum: [accepted] }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
  responses:
    Problem:
      description: An error, as a problem detail
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
