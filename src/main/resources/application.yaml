spring:
  application:
    name: template-service
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads for request handling
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  # Health and metrics on an internal port: no endpoint in workload.yaml exposes it, so only the
  # platform (probes, Prometheus) reaches it, and the API port serves the API alone.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true         # /actuator/health/liveness and /readiness for the platform
      show-details: never
  observations:
    key-values:
      service: ${spring.application.name}
  # Traces: OpenTelemetry, exported over OTLP when the data plane's collector is set, e.g.
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
  # The collector samples, so the service records every trace it takes part in.
  tracing:
    sampling:
      probability: 1.0
  # Metrics stay on /actuator/prometheus (the platform scrapes it); OTLP metrics push is off.
  otlp:
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ecs            # JSON logs; never log request bodies, identifiers or tokens

# Error reports (com.vrixel.service.observability.ErrorReports). Sentry starts only when SENTRY_DSN
# is set (no sentry.dsn here, so an unset DSN leaves Sentry off entirely). Unhandled exceptions and
# ERROR logs become events, grouped into issues; their alerts reach the SDLC tool.
sentry:
  environment: ${ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  max-request-body-size: none
  # Every report names its component, so the SDLC tool routes its issues to it.
  tags:
    component: ${spring.application.name}
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: error

app:
  security:
    enabled: true
    # The product's Keycloak realm (com.vrixel.service.security). Without both, the service refuses
    # to start rather than run unauthenticated or accept tokens issued for anything else.
    issuer: ${APP_ISSUER:}                     # https://id.<domain>/realms/<product>
    audience: ${APP_AUDIENCE:}                 # the product's API audience, e.g. emr-api
    tenant-claim: ${APP_TENANT_CLAIM:organization}   # the token claim naming the caller's tenant (Keycloak organizations)
  # Audit trail (com.vrixel.service.audit): kafka in deployed environments, log locally.
  audit:
    sink: ${AUDIT_SINK:log}
    bootstrap: ${AUDIT_KAFKA_BOOTSTRAP:}
    topic: ${AUDIT_TOPIC:audit.v1}
    required: ${AUDIT_REQUIRED:true}     # a request whose audit record can't be published fails (503)
    product: ${PRODUCT:}
    environment: ${ENVIRONMENT:}
    data-class: ${DATA_CLASS:general}    # general | phi | payments
    # kafka: { security.protocol: SASL_SSL, sasl.mechanism: SCRAM-SHA-512, sasl.jaas.config: ... }
  # Domain events (com.vrixel.service.events): every change is published to Kafka first, and the
  # event workers keep the data stores up to date. kafka in deployed environments, log locally.
  events:
    sink: ${EVENTS_SINK:log}
    bootstrap: ${EVENTS_KAFKA_BOOTSTRAP:}
    topic-prefix: ${EVENTS_TOPIC_PREFIX:local.template-service}   # topics are <prefix>.<entity>.v1
    source: ${EVENTS_SOURCE:}                                     # e.g. emr/intake-api
    timeout-ms: ${EVENTS_TIMEOUT_MS:5000}
    # kafka: { security.protocol: SASL_SSL, sasl.mechanism: SCRAM-SHA-512, sasl.jaas.config: ... }
  # Feature flags: the product's Flipt, read over OFREP. Unset, every flag reads as off.
  flags:
    url: ${FLAGS_URL:}
    environment: ${FLAGS_ENVIRONMENT:}   # e.g. production
    namespace: ${FLAGS_NAMESPACE:}       # e.g. emr
    token: ${FLAGS_TOKEN:}               # only if the product's Flipt requires one for evaluation
