# Runs after the Valxel SDLC deploys a commit: integration in dev, end-to-end in staging, smoke in
# production. Results are posted on the deployed commit as "integration / report", "e2e / report"
# and "smoke / report", which the pipeline's quality gates read. In staging, when the change needs
# it (performance: full), the load test too: "performance / report".
name: post-deploy

on:
  repository_dispatch:
    types: [valxel-deployed]
  workflow_dispatch:
    inputs:
      stage: { description: "dev, staging or production", required: true, type: choice, options: [dev, staging, production] }
      base_url: { description: "URL of the deployed service", required: true }
      sha: { description: "Deployed commit", required: true }

permissions:
  contents: read

concurrency:
  group: post-deploy-${{ github.event.client_payload.stage || inputs.stage }}-${{ github.event.client_payload.sha || inputs.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify ${{ github.event.client_payload.stage || inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    env:
      STAGE: ${{ github.event.client_payload.stage || inputs.stage }}
      BASE_URL: ${{ github.event.client_payload.base_url || inputs.base_url }}
      API_TOKEN: ${{ secrets.API_TOKEN }}       # a test identity's token for this environment (health is internal)
      REPORT_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REPORT_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run the stage's suite
        id: run
        run: |
          case "$STAGE" in
            dev) echo "suite=integration" >> "$GITHUB_OUTPUT" ;;
            staging) echo "suite=e2e" >> "$GITHUB_OUTPUT" ;;
            production) echo "suite=smoke" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown stage $STAGE" >&2; exit 2 ;;
          esac
          ./gradlew deployedTest
      - name: Report results
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report.py --context "${{ steps.run.outputs.suite }} / report" --junit 'build/test-results/deployedTest/*.xml'

  # The staging load test, when the Valxel SDLC says the change needs one: the product's expected
  # peak scaled to staging (peak_rps x load_factor), judged against the budget and the last passing
  # run (kept on the perf-baselines branch; a pass becomes the next baseline).
  performance:
    name: performance
    if: (github.event.client_payload.stage || inputs.stage) == 'staging' && github.event.client_payload.performance == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write     # the perf-baselines branch
      statuses: write
    env:
      BASE_URL: ${{ github.event.client_payload.base_url }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      REPORT_SHA: ${{ github.event.client_payload.sha }}
      SETTINGS: ${{ toJSON(github.event.client_payload.perf_settings) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REPORT_SHA }}
          persist-credentials: false
      - name: Load staging at the scaled peak
        run: |
          rps=$(python3 -c 'import json,os; s=json.loads(os.environ["SETTINGS"] or "{}") or {}; print(max(1, round((s.get("peak_rps") or 50) * (s.get("load_factor") or 0.1))))')
          echo "Target: $rps requests per second"
          mkdir -p out
          docker run --rm --network host --user "$(id -u)" -v "$PWD/perf:/perf:ro" -v "$PWD/out:/out" \
            -e BASE_URL -e API_TOKEN -e TARGET_RPS=$rps -e SUMMARY=/out/staging.json grafana/k6:2.3.0 run --quiet /perf/load.js
      - name: Judge and report
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          budget=$(python3 -c 'import json,os; s=json.loads(os.environ["SETTINGS"] or "{}") or {}; print(json.dumps((s.get("budgets") or {}).get("api") or {}))')
          pct=$(python3 -c 'import json,os; s=json.loads(os.environ["SETTINGS"] or "{}") or {}; print(s.get("regression_pct") or 10)')
          python3 perf/compare.py --kind api --run out/staging.json --budget "$budget" --regression "$pct" \
            --baseline staging.json --save-baseline staging.json --context "performance / report"

