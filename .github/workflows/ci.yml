# Required checks on the default branch: unit, contract (and CodeQL, from default setup).
# Job names are the check names the Valxel SDLC and the branch ruleset look for; keep them.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1 (also validates the wrapper)
      - run: ./gradlew test jacocoTestCoverageVerification
      - name: Report results
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report.py --context "unit / report" --junit 'build/test-results/test/*.xml' --jacoco build/reports/jacoco/test/jacocoTestReport.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: build/reports/
          retention-days: 14

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew contractTest
      - name: Report results
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report.py --context "contract / report" --junit 'build/test-results/contractTest/*.xml'

  # GitHub cannot read Gradle builds by itself: submit the resolved dependency graph so Dependabot
  # alerts and dependency review (the pipeline's "dependencies" suite) see every library.
  dependency-submission:
    name: dependency-submission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # OpenChoreo builds and ships the image; this proves it builds, starts (from its class data
      # archive) and has no known high or critical vulnerabilities with a fix available.
      - run: docker build --pull -t template-service:ci .
      - name: Start the image
        run: |
          docker run -d --name smoke -p 8081:8081 -e APP_SECURITY_ENABLED=false template-service:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/actuator/health/readiness; then
              docker logs smoke 2>&1 | grep -i "shared archive\|cds" || true
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1
      # Syft and Grype run as containers (pinned versions), not as marketplace actions.
      - name: Software bill of materials
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.57.1 \
            docker:template-service:ci -o cyclonedx-json > sbom.cyclonedx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 30
      - name: Scan for vulnerabilities with a fix
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.3 \
            docker:template-service:ci --only-fixed --fail-on high
